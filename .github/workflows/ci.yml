name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  context-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject default agent context
        run: |
          test ! -e AGENTS.md
          test ! -e CLAUDE.md
          test ! -e PREFERENCES.md
          test ! -e .agents
          test ! -e .claude
          test ! -e .pi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check pytest
      - run: python3 -m pytest -q
